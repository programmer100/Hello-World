<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Phone Number Entry</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      padding: 2rem;
      background: #f6f7f8;
      color: #222;
      margin: 0;
    }

    .label {
      display: block;
      margin-bottom: .25rem;
      font-weight: bold;
      color: #005587;
      letter-spacing: 0.02em;
    }

    .form-group {
      margin-bottom: 1.5rem;
      position: relative;
      width: 100%;
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
    }

    input,
    select,
    button {
      font-size: 1rem;
      font-family: inherit;
    }

    input,
    select {
      width: 100%;
      padding: .5rem;
      box-sizing: border-box;
      border: 1px solid #bfcad6;
      border-radius: 4px;
      background: #fff;
      transition: border-color 0.2s;
    }

    input:focus,
    select:focus {
      border-color: #005587;
      outline: none;
      box-shadow: 0 0 0 2px #cce4ff;
    }

    .phone-row {
      display: flex;
      flex-direction: row;
      gap: 0.5rem;
      align-items: flex-end;
      width: 100%;
      flex-wrap: nowrap;
    }

    .country-select {
      width: 170px;
      min-width: 170px;
      flex-shrink: 0;
      position: relative;
    }

    .country-select>button {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .5rem;
      border: 1px solid #bfcad6;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      outline: none;
      min-height: 40px;
      transition: border-color 0.2s;
    }

    .country-select>button:focus {
      border-color: #005587;
      box-shadow: 0 0 0 2px #cce4ff;
    }

    .country-select img.flag {
      width: 20px;
      height: auto;
      margin-right: .5rem;
      border-radius: 2px;
      border: 1px solid #e0e6ed;
      background: #fff;
    }

    .dropdown {
      position: absolute;
      top: calc(100% + 2px);
      left: 0;
      right: 0;
      border: 1px solid #bfcad6;
      border-radius: 4px;
      background: #fff;
      max-height: 240px;
      overflow-y: auto;
      box-shadow: 0 2px 8px rgba(0, 85, 135, 0.08);
      display: none;
      z-index: 9999;
      min-width: 100%;
    }

    .dropdown.active {
      display: block;
    }

    .dropdown input.search {
      width: 100%;
      padding: .5rem;
      box-sizing: border-box;
      border: none;
      border-bottom: 1px solid #e0e6ed;
      outline: none;
      background: #f6f7f8;
    }

    .option {
      display: flex;
      align-items: center;
      padding: .5rem;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }

    .option:hover,
    .option.active {
      background: #e6f0fa;
    }

    .ext-group {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-width: 90px;
      max-width: 110px;
      margin-left: 0.5rem;
      margin-bottom: 0;
      flex-shrink: 0;
    }

    #ext-input {
      width: 90px;
      min-width: 70px;
      max-width: 110px;
      padding: .5rem;
      box-sizing: border-box;
      border: 1px solid #bfcad6;
      border-radius: 4px;
      background: #fff;
      font-size: 1rem;
      margin-top: 0.15rem;
    }

    .role-group {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      min-width: 100px;
      max-width: 120px;
      margin-left: 0.5rem;
      margin-bottom: 0;
      flex-shrink: 0;
    }

    #role-select {
      width: 100px;
      min-width: 80px;
      max-width: 120px;
      margin-top: 0.15rem;
    }

    /* Responsive styles */
    @media (max-width: 900px) {
      .form-group {
        max-width: 100%;
      }
      .phone-row {
        flex-direction: column;
        gap: 0;
        align-items: stretch;
        flex-wrap: wrap;
      }
      .country-select,
      #phone-input,
      .ext-group,
      .role-group {
        width: 100% !important;
        min-width: 0 !important;
        max-width: 100% !important;
        margin-left: 0 !important;
      }
      #ext-input,
      #role-select {
        width: 100% !important;
        max-width: 100% !important;
      }
      button[type="submit"],
      .submit-btn {
        width: 100% !important;
        margin-left: 0 !important;
        margin-top: 1rem !important;
        height: auto !important;
        align-self: stretch !important;
      }
    }

    .error-message {
      color: #c62828;
      font-size: 0.95em;
      margin-top: .25rem;
      margin-bottom: 0;
      min-height: 1.2em;
      letter-spacing: 0.01em;
    }

    button[type="submit"],
    .submit-btn {
      background: #005587;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: .6rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-left: 0.5rem;
      height: 40px;
      align-self: flex-end;
    }

    button[type="submit"]:hover,
    .submit-btn:hover {
      background: #00395d;
    }

    #phone-input {
      flex: 2 1 0%;
      min-width: 0;
      margin-top: 0 !important;
      width: 100%;
      max-width: 100%;
    }
  </style>
</head>

<body>
  <form autocomplete="off" id="main-form" onsubmit="return false;">
    <div class="form-group">
      <label class="label" for="phone-input">Phone Number *</label>
      <div class="phone-row">
        <div class="country-select">
          <button type="button" id="selected-btn" aria-haspopup="listbox" aria-expanded="false" tabindex="0">
            <span>
              <img src="" class="flag" id="selected-flag" alt="">
              <span id="selected-code"></span>
            </span>
            <span>▾</span>
          </button>
          <div class="dropdown" id="dropdown" tabindex="-1">
            <input type="text" class="search" id="search-input" placeholder="Search country or code" autocomplete="off">
            <div id="options"></div>
          </div>
        </div>
        <input type="tel" id="phone-input" placeholder="###-###-####" maxlength="12" inputmode="numeric" pattern="[0-9\-]*" autocomplete="off" required>
        <div class="ext-group">
          <label class="label" for="ext-input" style="font-size:0.95em;margin-bottom:0.1rem;">Extension</label>
          <input type="text" id="ext-input" placeholder="e.g. 123" maxlength="7">
        </div>
        <div class="role-group">
          <label class="label" for="role-select" style="font-size:0.95em;margin-bottom:0.1rem;">Role</label>
          <select id="role-select">
            <option value="primary">Primary</option>
            <option value="work">Work</option>
            <option value="home">Home</option>
            <option value="mobile">Mobile</option>
          </select>
        </div>
        <button type="submit" class="submit-btn">Submit</button>
      </div>
      <div class="error-message" id="phone-error"></div>
      <div class="error-message" id="ext-error"></div>
    </div>
  </form>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1) Grab & parse the embedded JSON
      let countries = [];
      try {
        const raw = document.getElementById('countries-data').textContent;
        const items = JSON.parse(raw);
        countries = items
          .map(L => ({
            iso2: (typeof L.ISO_A2 === "string" ? L.ISO_A2.replace(/"/g, '') : '').toLowerCase(),
            name: typeof L.ISO_Country === "string" ? L.ISO_Country.replace(/"/g, '') : '',
            code: typeof L.CountryCode === "string" ? L.CountryCode.replace(/"/g, '') : ''
          }))
          .filter(c => c.iso2.match(/^[a-z]{2}$/) && c.code !== '0')
          .sort((a, b) => a.name.localeCompare(b.name));
      } catch (err) {
        countries = [
          { iso2: 'us', name: 'United States', code: '1' },
          { iso2: 'ca', name: 'Canada', code: '1' },
          { iso2: 'gb', name: 'United Kingdom', code: '44' },
          { iso2: 'au', name: 'Australia', code: '61' },
          { iso2: 'in', name: 'India', code: '91' }
        ];
        const form = document.querySelector('form');
        const warn = document.createElement('div');
        warn.style.color = 'red';
        warn.style.marginBottom = '1rem';
        warn.textContent = '⚠️ Country list is incomplete due to invalid JSON.';
        form.parentNode.insertBefore(warn, form);
      }
      const dropdown = document.getElementById('dropdown');
      const btn = document.getElementById('selected-btn');
      const flagImg = document.getElementById('selected-flag');
      const codeSpan = document.getElementById('selected-code');
      const optsDiv = document.getElementById('options');
      const searchInp = document.getElementById('search-input');
      let selectedCountry = null;
      function render(list) {
        optsDiv.innerHTML = '';
        list.forEach((c, idx) => {
          const div = document.createElement('div');
          div.className = 'option';
          div.setAttribute('role', 'option');
          div.setAttribute('tabindex', '0');
          div.innerHTML = `
            <img class="flag" src="https://flagcdn.com/w20/${c.iso2}.png" alt="${c.name}">
            <span>${c.name} +${c.code}</span>
          `;
          div.onclick = (e) => {
            e.stopPropagation();
            selectCountry(c);
            dropdown.classList.remove('active');
            btn.setAttribute('aria-expanded', 'false');
          };
          div.onkeydown = (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              div.click();
            }
          };
          optsDiv.appendChild(div);
        });
      }
      function selectCountry(c) {
        selectedCountry = c;
        flagImg.src = `https://flagcdn.com/w20/${c.iso2}.png`;
        flagImg.alt = c.name;
        codeSpan.textContent = `+${c.code}`;
      }
      render(countries);
      const ca = countries.find(c => c.iso2 === 'ca') || countries[0];
      selectCountry(ca);
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        const isActive = dropdown.classList.toggle('active');
        btn.setAttribute('aria-expanded', isActive ? 'true' : 'false');
        if (isActive) {
          searchInp.value = '';
          render(countries);
          setTimeout(() => searchInp.focus(), 10);
        }
      });
      searchInp.addEventListener('input', () => {
        const term = searchInp.value.toLowerCase();
        render(
          countries.filter(c =>
            c.name.toLowerCase().includes(term) ||
            c.code.includes(term)
          )
        );
      });
      document.addEventListener('pointerdown', e => {
        if (!dropdown.contains(e.target) && !btn.contains(e.target)) {
          dropdown.classList.remove('active');
          btn.setAttribute('aria-expanded', 'false');
        }
      });
      btn.addEventListener('keydown', e => {
        if (e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          dropdown.classList.add('active');
          btn.setAttribute('aria-expanded', 'true');
          searchInp.focus();
        }
      });
      searchInp.addEventListener('keydown', e => {
        if (e.key === 'ArrowDown') {
          const firstOption = optsDiv.querySelector('.option');
          if (firstOption) firstOption.focus();
        } else if (e.key === 'Escape') {
          dropdown.classList.remove('active');
          btn.setAttribute('aria-expanded', 'false');
          btn.focus();
        }
      });
      optsDiv.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
          dropdown.classList.remove('active');
          btn.setAttribute('aria-expanded', 'false');
          btn.focus();
        }
      });
      dropdown.classList.remove('active');
      btn.setAttribute('aria-expanded', 'false');
      const phoneInput = document.getElementById('phone-input');
      const phoneError = document.getElementById('phone-error');
      const extInput = document.getElementById('ext-input');
      const extError = document.getElementById('ext-error');
      const form = document.getElementById('main-form');
      // Extension input validation: only numbers, max 6 digits
      extInput.addEventListener('input', () => {
        let value = extInput.value.replace(/\D/g, '');
        if (value.length > 6) value = value.slice(0, 6);
        extInput.value = value;
        if (value.length > 0 && value.length > 6) {
          extError.textContent = 'Extension must be up to 6 digits.';
        } else {
          extError.textContent = '';
        }
      });
      phoneInput.addEventListener('input', (e) => {
        let value = phoneInput.value.replace(/\D/g, '');
        if (value.length > 10) value = value.slice(0, 10);
        let formatted = value;
        if (value.length > 6) {
          formatted = value.slice(0, 3) + '-' + value.slice(3, 6) + '-' + value.slice(6);
        } else if (value.length > 3) {
          formatted = value.slice(0, 3) + '-' + value.slice(3);
        }
        phoneInput.value = formatted;
        if (!value) {
          phoneError.textContent = 'Phone number is required.';
        } else if (value.length < 10) {
          phoneError.textContent = 'Please enter a 10-digit phone number.';
        } else {
          phoneError.textContent = '';
        }
      });
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        let value = phoneInput.value.replace(/\D/g, '');
        let extValue = extInput.value;
        let valid = true;
        // Phone number validation
        if (!value) {
          phoneError.textContent = 'Phone number is required.';
          phoneInput.focus();
          valid = false;
        } else if (value.length < 10) {
          phoneError.textContent = 'Please enter a 10-digit phone number.';
          phoneInput.focus();
          valid = false;
        } else {
          phoneError.textContent = '';
        }
        // Extension validation
        if (extValue && !/^\d{1,6}$/.test(extValue)) {
          extError.textContent = 'Extension must be 1 to 6 digits.';
          extInput.focus();
          valid = false;
        } else {
          extError.textContent = '';
        }
        if (!valid) return false;
        alert('Form submitted!');
      });
    });
  </script>
